[workspace]
members = ["."]
resolver = "2"

[package]
name = "sigma-payments"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "MIT OR Apache-2.0"
authors = ["Sigma Tactical Group contributors <https://github.com/sigmatactical-org>"]
homepage = "https://payments.sigma-tactical.com"
description = "Payment methods for Sigma Tactical Group identity users"
publish = false

[dependencies]
anyhow = "1.0.103"
askama = "0.16.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
sigma-config = { git = "https://github.com/sigmatactical-org/config.git", rev = "e66ad4ed16f248b7235c149bec8bba279c7414d2" }
sigma-theme = { git = "https://github.com/sigmatactical-org/sigma-theme.git", rev = "8419ea6a03fbb808f9dc50f02e8711cac9e67318", default-features = false, features = ["askama", "warp"] }
sigma-identity-nav = { git = "https://github.com/sigmatactical-org/identity.git", rev = "0116f54a1aac8c71bcc1d7dfe92df1dd6d8a2371", package = "sigma-identity-nav" }
sigma-pg = { git = "https://github.com/sigmatactical-org/sigma-pg.git", rev = "532a31e1d0f9084b8eb8dc51083a5e6899df1b40" }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.23.5", features = ["v4", "serde"] }
warp = { version = "0.4.3", features = ["server"] }

[dev-dependencies]
warp = { version = "0.4.3", features = ["test"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
